plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'com.google.gms.google-services'
  id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
  compileSdk 36
  namespace = "com.kodeco.android.aam"
  defaultConfig {
    applicationId "com.kodeco.android.aiml"
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables {
      useSupportLibrary true
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  kotlinOptions {
    jvmTarget = '1.8'
  }
  buildFeatures {
    viewBinding true
    compose true
  }
  composeOptions {
    kotlinCompilerExtensionVersion '1.4.3'
  }
  packagingOptions {
    resources {
      excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  // Kotlin
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"

  // Jetpack Compose
  implementation platform('androidx.compose:compose-bom:2025.08.01')
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.material3:material3:1.3.2"
  implementation "androidx.compose.material:material-icons-extended:1.3.2"
  implementation "androidx.compose.ui:ui-tooling-preview"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.3"
  implementation "androidx.activity:activity-compose:1.10.1"
  implementation "androidx.core:core-splashscreen:1.0.1"
  implementation "androidx.navigation:navigation-compose:2.9.3"
  implementation 'androidx.compose.material3:material3:1.4.0'

  // Markdown
  var richTextVersion = "1.0.0-alpha03"
  implementation "com.halilibo.compose-richtext:richtext-ui-material3:$richTextVersion"
  implementation "com.halilibo.compose-richtext:richtext-commonmark:$richTextVersion"

  // Firebase AI Logic
  var firebaseAiLogicVersion = "17.4.0"
  implementation "com.google.firebase:firebase-ai:$firebaseAiLogicVersion"
}