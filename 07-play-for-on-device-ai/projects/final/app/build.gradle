plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'com.google.gms.google-services'
}

android {
  compileSdk 36
  namespace = "com.kodeco.android.aam"
  defaultConfig {
    applicationId "com.kodeco.android.aiml"
    minSdk rootProject.ext.minSdkVersion
    targetSdk rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables {
      useSupportLibrary true
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  kotlinOptions {
    jvmTarget = '1.8'
  }
  buildFeatures {
    viewBinding true
    compose true
  }
  composeOptions {
    kotlinCompilerExtensionVersion '1.4.3'
  }
  packagingOptions {
    resources {
      excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
  }

  // AI Pack Declaration
  assetPacks = [":onDemandAiPack"]
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  // Kotlin
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.fragment:fragment-ktx:1.8.9"

  // Jetpack Compose
  implementation platform('androidx.compose:compose-bom:2025.09.01')
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.material:material"
  implementation "androidx.compose.material:material-icons-extended"
  implementation "androidx.compose.material3:material3:1.4.0"
  implementation "androidx.compose.ui:ui-tooling-preview"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
  implementation "androidx.activity:activity-compose:1.11.0"
  implementation "androidx.core:core-splashscreen:1.0.1"
  implementation "androidx.navigation:navigation-compose:2.9.5"

  // Markdown
  var richTextVersion = "1.0.0-alpha03"
  implementation "com.halilibo.compose-richtext:richtext-ui-material3:$richTextVersion"
  implementation "com.halilibo.compose-richtext:richtext-commonmark:$richTextVersion"

  // MediaPipe
  var mediaPipeVersion = "0.10.29"
  implementation "com.google.mediapipe:tasks-genai:$mediaPipeVersion"

  // TUTORIAL DEPENDENCIES
  var aiDeliveryVersion = "0.1.1-alpha01"
  implementation "com.google.android.play:ai-delivery:$aiDeliveryVersion"
}